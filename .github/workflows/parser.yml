name: Обновление данных АЗС Крым

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Проверка репозитория
      uses: actions/checkout@v4

    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Запуск парсера
      run: python parse_fuel.py

    - name: Сохранение обновленных данных на сайт
      run: |
        git config --global user.name "FuelBot"
        git config --global user.email "bot@github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Авто-обновление базы АЗС Крым" && git push)
