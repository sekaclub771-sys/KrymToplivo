<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Крым Топливо | Бортовой Локатор</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="КрымТопливо">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root {
            --bg-dark: #03050a;
            --card-glass: rgba(15, 22, 42, 0.65);
            --card-border: rgba(56, 189, 248, 0.12);
            --neon-blue: #38bdf8;
            --neon-purple: #c084fc;
            --neon-green: #4ade80;
            --neon-amber: #fb923c;
            --neon-red: #f87171;
            --text-main: #f8fafc;
            --text-sub: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; padding-bottom: 60px; -webkit-font-smoothing: antialiased; }
        .container { width: 92%; max-width: 500px; margin: 0 auto; }
        header { background: rgba(3, 5, 10, 0.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--card-border); padding: 16px 0; position: sticky; top: 0; z-index: 100; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        .brand-wrapper { display: flex; align-items: center; gap: 12px; }
        .crimea-flag { width: 40px; height: 24px; border-radius: 4px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.08); }
        .flag-blue { height: 16.6%; background: #0046B8; }
        .flag-white { height: 66.8%; background: #FFFFFF; }
        .flag-red { height: 16.6%; background: #D52B1E; }
        .logo-text { font-size: 20px; font-weight: 900; background: linear-gradient(to right, #ffffff, var(--neon-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .sys-status { display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--neon-green); }
        .pulse-dot { width: 6px; height: 6px; background: var(--neon-green); border-radius: 50%; }
        .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 20px 0 12px 0; }
        .summary-card { background: var(--card-glass); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px 4px; text-align: center; }
        .sum-val { font-size: 22px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
        .sum-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--text-sub); }
        .summary-card.ok .sum-val { color: var(--neon-green); }
        .summary-card.warn .sum-val { color: var(--neon-amber); }
        .summary-card.alert .sum-val { color: var(--neon-red); }
        .control-panel { background: var(--card-glass); border: 1px solid var(--card-border); border-radius: 20px; padding: 18px; margin-bottom: 20px; }
        input { width: 100%; background: #070a12; border: 1px solid rgba(56, 189, 248, 0.15); padding: 14px 16px; border-radius: 12px; color: white; font-size: 15px; outline: none; margin-bottom: 12px; }
        .fuel-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .tab-btn { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); padding: 12px 0; border-radius: 10px; color: #475569; font-size: 13px; font-weight: 800; }
        .tab-btn.active { color: white; background: #0b1220; border-color: var(--neon-blue); }
        .map-section { background: var(--card-glass); border: 1px solid var(--card-border); border-radius: 20px; padding: 10px; margin-bottom: 20px; }
        .map-label { font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--neon-blue); margin: 6px 0 10px 8px; }
        .map-container { width: 100%; height: 260px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.04); }
        iframe { width: 100%; height: 100%; border: none; }
        .grid { display: flex; flex-direction: column; gap: 14px; }
        .cyber-card { background: var(--card-glass); border: 1px solid var(--card-border); border-radius: 20px; padding: 20px; position: relative; }
        .status-container { position: absolute; top: 20px; right: 20px; text-align: right; }
        .status-val { font-size: 24px; font-weight: 900; line-height: 1; }
        .status-lbl { font-size: 9px; font-weight: 700; text-transform: uppercase; color: var(--text-sub); }
        .station-title { font-size: 20px; font-weight: 800; color: white; margin-bottom: 2px; }
        .station-address { font-size: 13px; color: var(--text-sub); margin-bottom: 14px; display: flex; flex-direction: column; gap: 4px; }
        .geo-pill { display: inline-flex; align-items: center; background: rgba(192, 132, 252, 0.08); border: 1px solid rgba(192, 132, 252, 0.2); color: #e9d5ff; font-weight: 700; font-size: 11px; padding: 3px 8px; border-radius: 6px; }
        .bar-container { margin-bottom: 14px; }
        .bar-track { height: 5px; background: rgba(255,255,255,0.03); border-radius: 10px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; border-radius: 10px; }
        .badges-list { display: flex; gap: 6px; margin-bottom: 14px; }
        .badge-node { background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.06); color: #334155; padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 800; }
        .badge-node.active-95 { background: rgba(56, 189, 248, 0.08); border-color: rgba(56, 189, 248, 0.25); color: var(--neon-blue); }
        .badge-node.active-92 { background: rgba(245, 158, 11, 0.08); border-color: rgba(245, 158, 11, 0.25); color: var(--neon-amber); }
        .badge-node.active-dt { background: rgba(74, 222, 128, 0.08); border-color: rgba(74, 222, 128, 0.25); color: var(--neon-green); }
        .info-panel { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255,255,255,0.02); padding: 12px; border-radius: 10px; font-size: 13px; color: #94a3b8; line-height: 1.4; margin-bottom: 14px; }
        .route-button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: linear-gradient(135deg, #ff5c00 0%, #ff8c00 100%); border: none; padding: 14px; border-radius: 12px; color: white; font-size: 14px; font-weight: 800; }
    </style>
</head>
<body>
    <header>
        <div class="container header-flex">
            <div class="brand-wrapper"><div class="crimea-flag"><div class="flag-blue"></div><div class="flag-white"></div><div class="flag-red"></div></div><div class="logo-text">Крым Топливо</div></div>
            <div class="sys-status"><div class="pulse-dot"></div><span>Борт-ИИ</span></div>
        </div>
    </header>
    <main class="container">
        <section class="summary-grid">
            <div class="summary-card ok"><div class="sum-val" id="sum-ok">0</div><div class="sum-lbl">Доступно</div></div>
            <div class="summary-card warn"><div class="sum-val" id="sum-warn">0</div><div class="sum-lbl">Очередь</div></div>
            <div class="summary-card alert"><div class="sum-val" id="sum-alert">0</div><div class="sum-lbl">Дефицит</div></div>
        </section>
        <section class="control-panel">
            <input type="text" id="searchInput" placeholder="Поиск города, трассы или АЗС..." onkeyup="processFilters()">
            <div class="fuel-tabs">
                <button class="tab-btn active" id="btn-all" onclick="switchFuelTab('all')">Все</button>
                <button class="tab-btn" id="btn-95" onclick="switchFuelTab('АИ-95')">95</button>
                <button class="tab-btn" id="btn-92" onclick="switchFuelTab('АИ-92')">92</button>
                <button class="tab-btn" id="btn-dt" onclick="switchFuelTab('ДТ')">ДТ</button>
            </div>
        </section>
        <section class="map-section">
            <div class="map-label">🗺️ Интерактивный Радар Трафика</div>
            <div class="map-container"><iframe src="https://yandex.ru" allowfullscreen="true"></iframe></div>
        </section>
        <div class="grid" id="cyberCardsGrid"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
