<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Крым Топливо Локатор</title>
    
    <!-- Настройки PWA приложения для iOS и Android -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="КрымТопливо">
    <link rel="apple-touch-icon" href="https://flaticon.com">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.11);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-main: #ffffff;
            --text-sub: #cbd5e1;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 40px;
            -webkit-font-smoothing: antialiased;
        }

        .container { width: 92%; max-width: 600px; margin: 0 auto; }

        /* Живой статус-бар уведомлений сверху */
        .notification-bar {
            background: rgba(16, 185, 129, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 14px;
            padding: 14px 20px;
            margin: 20px 0;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
        .pulse-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); animation: pulse 1.6s infinite; }

        /* Поле поиска и фильтры под большой палец */
        .search-section {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }
        
        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 16px 20px;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        input:focus { border-color: #a855f7; background: rgba(0, 0, 0, 0.3); }

        .fuel-filters { display: flex; gap: 10px; }
        .filter-btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 14px 0;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }

        /* Сетка премиальных карточек АЗС */
        .grid { display: flex; flex-direction: column; gap: 16px; }
        
        .card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }
        .card:active { transform: scale(0.98); }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .brand { font-size: 22px; font-weight: 700; background: linear-gradient(to right, #ffffff, #e2e8f0); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .address { font-size: 14px; color: var(--text-sub); margin-bottom: 16px; display: flex; align-items: center; gap: 4px; }
        
        .fuel-row { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .fuel-badge { background: rgba(239, 68, 68, 0.25); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; padding: 5px 12px; border-radius: 8px; font-size: 13px; font-weight: 700; }
        .fuel-badge.active-92 { background: rgba(234, 88, 12, 0.25); border: 1px solid rgba(234, 88, 12, 0.4); color: #fed7aa; }
        .fuel-badge.active-dt { background: rgba(16, 185, 129, 0.25); border: 1px solid rgba(16, 185, 129, 0.4); color: #a7f3d0; }

        .notes { background: rgba(0, 0, 0, 0.15); padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.4; color: #e2e8f0; border-left: 3px solid #6366f1; margin-bottom: 12px; }
        .meta { font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body>

    <main class="container">
        <!-- Виджет уведомлений сверху -->
        <div class="notification-bar">
            <div class="pulse-dot"></div>
            <div><strong>Сводка:</strong> Все нефтебазы Крыма работают штатно. Обновление каждый час.</div>
        </div>

        <!-- Поиск и фильтрация -->
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Введите город или трассу..." onkeyup="runFilters()">
            <div class="fuel-filters">
                <button class="filter-btn active" id="btn-all" onclick="selectFuel('all')">Все АЗС</button>
                <button class="filter-btn" id="btn-95" onclick="selectFuel('АИ-95')">АИ-95</button>
                <button class="filter-btn" id="btn-92" onclick="selectFuel('АИ-92')">АИ-92</button>
                <button class="filter-btn" id="btn-dt" onclick="selectFuel('ДТ')">ДТ</button>
            </div>
        </section>

        <!-- Место вывода карточек -->
        <div class="grid" id="cardsContainer"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
