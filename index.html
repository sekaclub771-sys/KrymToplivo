<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Крым Топливо Локатор | Предсказание АЗС</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="КрымТопливо">
    <link rel="apple-touch-icon" href="https://flaticon.com">

    <style>
        :root {
            --cyber-bg: #05070f;
            --cyber-card: rgba(13, 18, 36, 0.75);
            --cyber-border: rgba(56, 189, 248, 0.15);
            --neon-blue: #38bdf8;
            --neon-purple: #a855f7;
            --neon-green: #22c55e;
            --neon-amber: #f59e0b;
            --neon-red: #ef4444;
            --text-neon: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "SF Pro Display", -apple-system, sans-serif; }
        
        body {
            background: var(--cyber-bg);
            color: var(--text-neon);
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        /* Футуристичная неоновая шапка */
        header {
            background: rgba(5, 7, 15, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 2px solid var(--cyber-border);
            padding: 18px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 5px 25px rgba(56, 189, 248, 0.08);
        }
        .container { width: 92%; max-width: 540px; margin: 0 auto; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; }
        .brand-wrapper { display: flex; align-items: center; gap: 15px; }
        
        /* Глянцевый трехмерный флаг Крыма */
        .crimea-flag {
            width: 46px;
            height: 28px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .flag-blue { height: 16.6%; background: #0046B8; }
        .flag-white { height: 66.8%; background: #FFFFFF; }
        .flag-red { height: 16.6%; background: #D52B1E; }

        .logo-text { font-size: 24px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; background: linear-gradient(to right, #ffffff, var(--neon-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 10px rgba(56,189,248,0.3); }

        .system-radar { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: var(--neon-green); }
        .radar-pulse { width: 8px; height: 8px; background: var(--neon-green); border-radius: 50%; animation: radar 1.5s infinite; }

        /* Панель управления (Поиск / Кнопки) */
        .control-panel {
            background: var(--cyber-card);
            border: 1px solid var(--cyber-border);
            border-radius: 22px;
            padding: 22px;
            margin: 25px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
        }
        .control-panel::before { content: ''; position: absolute; top:-1px; left:20px; right:20px; height:1px; background: linear-gradient(to right, transparent, var(--neon-blue), transparent); }
        
        input {
            width: 100%;
            background: #090c15;
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 16px 18px;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            outline: none;
            margin-bottom: 16px;
            transition: all 0.3s ease;
        }
        input:focus { border-color: var(--neon-purple); box-shadow: 0 0 15px rgba(168, 85, 247, 0.25); }

        .fuel-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .tab-btn {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 0;
            border-radius: 12px;
            color: #64748b;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            color: white;
            background: #0d1527;
            border-color: var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
        }

        /* Карточки кибер-интерфейса */
        .grid { display: flex; flex-direction: column; gap: 20px; }
        
        .cyber-card {
            background: var(--cyber-card);
            border: 1px solid var(--cyber-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            position: relative;
            transition: transform 0.2s;
        }
        
        /* Виджет вероятности на карточке */
        .predict-widget {
            position: absolute;
            top: 22px;
            right: 24px;
            text-align: right;
        }
        .predict-percent { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
        .predict-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #64748b; letter-spacing: 0.5px; margin-top: 2px; }

        .brand-name { font-size: 24px; font-weight: 900; letter-spacing: -0.5px; color: white; margin-bottom: 4px; }
        .station-geo { font-size: 14px; color: #64748b; margin-bottom: 18px; }
        
        /* Аналитическая шкала (Прогресс-бар вероятности) */
        .prob-container { margin-bottom: 18px; }
        .prob-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 10px; overflow: hidden; position: relative; }
        .prob-bar { height: 100%; width: 0%; border-radius: 10px; transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Строка топлива */
        .badges-row { display: flex; gap: 8px; margin-bottom: 18px; }
        .neon-badge { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: #475569; padding: 6px 12px; border-radius: 8px; font-size: 13px; font-weight: 800; }
        .neon-badge.on-95 { background: rgba(56, 189, 248, 0.1); border-color: rgba(56, 189, 248, 0.4); color: var(--neon-blue); }
        .neon-badge.on-92 { background: rgba(245, 158, 11, 0.1); border-color: rgba(245, 158, 11, 0.4); color: var(--neon-amber); }
        .neon-badge.on-dt { background: rgba(34, 197, 94, 0.1); border-color: rgba(34, 197, 94, 0.4); color: var(--neon-green); }

        .log-box { background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255,255,255,0.04); padding: 14px; border-radius: 12px; font-size: 14px; color: #94a3b8; line-height: 1.4; }

        @keyframes radar {
            0% { transform: scale(0.9); opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6); }
            70% { transform: scale(1); opacity: 0.5; box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.9); opacity: 1; box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body>

    <!-- Шапка Трона/Киберпанка с флагом -->
    <header>
        <div class="container header-flex">
            <div class="brand-wrapper">
                <div class="crimea-flag">
                    <div class="flag-blue"></div>
                    <div class="flag-white"></div>
                    <div class="flag-red"></div>
                </div>
                <div class="logo-text">Крым Топливо</div>
            </div>
            <div class="system-radar">
                <div class="radar-pulse"></div>
                <span>Анализ Сети</span>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Панель управления -->
        <section class="control-panel">
            <input type="text" id="searchInput" placeholder="Поиск локации, трассы или бренда..." onkeyup="processFilters()">
            <div class="fuel-grid">
                <button class="tab-btn active" id="tab-all" onclick="switchFuelTab('all')">Все</button>
                <button class="tab-btn" id="tab-95" onclick="switchFuelTab('АИ-95')">95</button>
                <button class="tab-btn" id="tab-92" onclick="switchFuelTab('АИ-92')">92</button>
                <button class="tab-btn" id="tab-dt" onclick="switchFuelTab('ДТ')">ДТ</button>
            </div>
        </section>

        <!-- Карточки заправок -->
        <div class="grid" id="cyberCardsGrid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
